<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale acquisti e vendite</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div class="max-w-6xl mx-auto px-4 py-8">

	<header class="flex flex-wrap items-center justify-between gap-3 mb-6">
		<div>
			<h1 class="text-2xl font-semibold">Acquisti e vendite</h1>
			<p class="text-sm text-slate-500">I dati sono salvati sul server a ogni modifica</p>
		</div>
		<div class="flex flex-wrap items-center gap-2">
			<button id="btnImp" class="border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-3 py-1.5 text-sm">Importa Excel</button>
			<button id="btnDl" class="border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-3 py-1.5 text-sm">Scarica Excel</button>
			<div class="flex items-center gap-2 text-sm px-3 py-1.5 rounded-full bg-white border border-slate-200">
				<span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
				<span id="stxt" class="text-slate-600">Caricamento…</span>
			</div>
			<form method="post" action="{% url 'logout' %}" class="flex items-center gap-2 text-sm">
				{% csrf_token %}
				<span class="text-slate-500">{{ user.get_username }}</span>
				<button type="submit" class="border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-3 py-1.5">Esci</button>
			</form>
		</div>
	</header>
	<input type="file" id="upl" accept=".xlsx,.xls,.ods" class="hidden">

	<main id="app" class="space-y-6">
		<section class="bg-white border border-slate-200 rounded-2xl p-5">
			<h2 class="text-sm font-semibold text-slate-500 mb-3">Nuovo acquisto</h2>
			<div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
				<label class="md:col-span-3 text-sm text-slate-600">Data e ora
					<input id="dt" type="datetime-local" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
				</label>
				<label class="md:col-span-5 text-sm text-slate-600">Descrizione
					<input id="ds" type="text" maxlength="255" placeholder="Lampada vintage in ottone" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
				</label>
				<label class="md:col-span-2 text-sm text-slate-600">Prezzo (€)
					<input id="pr" type="number" min="0" step="0.01" placeholder="25,00" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
				</label>
				<button id="add" class="md:col-span-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg px-4 py-2 text-sm font-medium h-[38px]">Aggiungi</button>
			</div>
			<p id="err" class="text-sm text-red-600 mt-2 min-h-[1.25rem]"></p>
		</section>

		<section class="flex flex-wrap items-center gap-3">
			<select id="per" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"></select>
			<select id="flt" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
				<option value="all">Tutti</option><option value="stock">In magazzino</option><option value="sold">Venduti</option>
			</select>
			<input id="q" type="text" placeholder="Cerca" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm w-48">
		</section>

		<section id="mets" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></section>

		<section class="bg-white border border-slate-200 rounded-2xl overflow-x-auto">
			<table class="w-full text-sm">
				<thead class="text-left text-slate-500 border-b border-slate-200">
					<tr>
						<th class="px-4 py-3 font-medium">Acquisto</th>
						<th class="px-4 py-3 font-medium">Descrizione</th>
						<th class="px-4 py-3 font-medium text-right">Costo</th>
						<th class="px-4 py-3 font-medium">Vendita</th>
						<th class="px-4 py-3 font-medium text-right">Utile</th>
						<th class="px-4 py-3"></th>
					</tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</section>
	</main>
</div>

<script>
const FMT_D = 'dd/mm/yyyy hh:mm', FMT_E = '#,##0.00 €';
let items = [], selling = null, busy = 0;

const $ = id => document.getElementById(id);
const r2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const eur = n => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n || 0);
const fmt = d => d ? d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const clock = () => new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const ym = d => d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) : '';
const esc = s => String(s).replace(/[&<>"]/g, c => '&' + ({ '&': 'amp', '<': 'lt', '>': 'gt', '"': 'quot' }[c]) + ';');
const toInput = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
const fromInput = s => { const [a, b] = s.split('T'), [y, m, d] = a.split('-'), [h, mi] = b.split(':'); return new Date(+y, m - 1, +d, +h, +mi); };

const ser = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 864e5 + 25569;
function toDate(v) {
	if (v == null || v === '') return null;
	if (typeof v === 'number') { const u = new Date(Math.round((v - 25569) * 864e5)); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes()); }
	const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2}))?/);
	if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
	const d = new Date(v); return isNaN(d) ? null : d;
}
function num(v) {
	if (typeof v === 'number') return r2(v);
	let s = String(v == null ? '' : v).replace(/[€\s]/g, '');
	if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
	const n = parseFloat(s); return isNaN(n) ? 0 : r2(n);
}

// --- Server API ---------------------------------------------------------

const csrf = () => (document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/) || [])[1] || '';

function apiError(data) {
	if (!data || typeof data !== 'object') return 'errore sconosciuto';
	if (data.detail) return data.detail;
	const first = v => Array.isArray(v) ? first(v.find(x => x && (typeof x !== 'object' || Object.keys(x).length))) : (v && typeof v === 'object' ? first(Object.values(v)[0]) : v);
	return String(first(Object.values(data)) || 'dati non validi');
}

async function api(path, method = 'GET', body) {
	busy++; setStatus('busy', method === 'GET' ? 'Caricamento…' : 'Salvataggio…');
	try {
		const r = await fetch('/api/' + path, {
			method, credentials: 'same-origin',
			headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
			body: body === undefined ? undefined : JSON.stringify(body),
		});
		if (r.status === 401 || r.status === 403) { location.href = '/accounts/login/?next=/'; throw new Error('Sessione scaduta'); }
		const data = r.status === 204 ? null : await r.json().catch(() => null);
		if (!r.ok) throw new Error(apiError(data));
		if (method !== 'GET') setStatus('ok', 'Salvato alle ' + clock());
		return data;
	} catch (e) {
		setStatus('err', e instanceof TypeError ? 'Server non raggiungibile' : 'Non salvato');
		throw e;
	} finally { busy--; }
}

const money = n => r2(n).toFixed(2);
const fromApi = o => ({
	id: String(o.id), dt: new Date(o.acquisto_dt), ds: o.descrizione, pp: Number(o.prezzo_acquisto),
	sp: o.prezzo_vendita == null ? null : Number(o.prezzo_vendita), sdt: o.vendita_dt ? new Date(o.vendita_dt) : null,
});
const toApi = i => ({
	acquisto_dt: i.dt.toISOString(), descrizione: i.ds, prezzo_acquisto: money(i.pp),
	vendita_dt: i.sp != null ? i.sdt.toISOString() : null, prezzo_vendita: i.sp != null ? money(i.sp) : null,
});
const putLocal = o => { const n = fromApi(o), k = items.findIndex(x => x.id === n.id); if (k < 0) items.push(n); else items[k] = n; };

async function load() {
	try {
		items = (await api('items/')).map(fromApi);
		setStatus('ok', 'Dati aggiornati');
	} catch (e) {
		$('rows').innerHTML = '<tr><td colspan="6" class="px-4 py-10 text-center text-red-600">Non riesco a caricare i dati: ' + esc(e.message) + '</td></tr>';
		return;
	}
	$('dt').value = toInput(new Date());
	refreshUI();
}

function setStatus(kind, text) {
	$('dot').className = 'w-2.5 h-2.5 rounded-full ' + ({ ok: 'bg-emerald-500', err: 'bg-red-500', busy: 'bg-amber-400' }[kind] || 'bg-slate-300');
	$('stxt').textContent = text;
}

// --- Excel import / export ----------------------------------------------

function parseWb(buf) {
	const wb = XLSX.read(buf, { type: 'array' });
	const ws = wb.Sheets['Registro'] || wb.Sheets[wb.SheetNames[0]];
	if (!ws) return [];
	const raw = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
	if (raw.length) { const k = Object.keys(raw[0]); if (!k.includes('Descrizione') || !k.includes('Prezzo acquisto')) throw new Error('mancano le colonne "Descrizione" e "Prezzo acquisto"'); }
	return raw.filter(r => r['Descrizione'] != null || r['Prezzo acquisto'] != null).map(r => {
		const sold = r['Prezzo vendita'] != null ? String(r['Prezzo vendita']).trim() !== '' : false;
		const dt = toDate(r['Data acquisto']) || new Date();
		return { dt, ds: String(r['Descrizione'] == null ? '' : r['Descrizione']).slice(0, 255), pp: num(r['Prezzo acquisto']),
						 sp: sold ? num(r['Prezzo vendita']) : null, sdt: sold ? (toDate(r['Data vendita']) || dt) : null };
	});
}

$('btnImp').onclick = () => $('upl').click();
$('upl').onchange = async e => {
	const f = e.target.files[0]; e.target.value = ''; if (!f) return;
	let list;
	try { list = parseWb(await f.arrayBuffer()); }
	catch (err) { alert('Non riesco a leggere il file: ' + err.message); return; }
	if (!list.length) { alert('Il file «' + f.name + '» non contiene oggetti.'); return; }
	let replace = false;
	if (items.length) {
		replace = confirm('Il file «' + f.name + '» contiene ' + list.length + ' oggetti.\n\n' +
			'OK = sostituisci i ' + items.length + ' oggetti attuali\nAnnulla = scegli se aggiungerli');
		if (!replace && !confirm('Aggiungere i ' + list.length + ' oggetti a quelli attuali?')) return;
	}
	try {
		const r = await api('items/import/', 'POST', { items: list.map(toApi), replace });
		selling = null;
		await load();
		setStatus('ok', 'Importati ' + r.imported + ' oggetti alle ' + clock());
	} catch (err) { alert('Importazione non riuscita, nessun dato modificato: ' + err.message); }
};

function sheet(aoa, fmts, cols) {
	const ws = XLSX.utils.aoa_to_sheet(aoa);
	for (let r = 1; r < aoa.length; r++) for (const c in fmts) {
		const cell = ws[XLSX.utils.encode_cell({ r, c: +c })];
		if (cell) if (cell.t === 'n') cell.z = fmts[c];
	}
	ws['!cols'] = cols;
	return ws;
}

function buildWb() {
	const wb = XLSX.utils.book_new();
	const sorted = items.slice().sort((a, b) => a.dt - b.dt);
	const reg = [['ID', 'Data acquisto', 'Descrizione', 'Prezzo acquisto', 'Stato', 'Data vendita', 'Prezzo vendita', 'Utile']];
	sorted.forEach(i => reg.push([i.id, ser(i.dt), i.ds, i.pp, i.sp != null ? 'Venduto' : 'In magazzino',
		i.sp != null ? ser(i.sdt) : null, i.sp, i.sp != null ? r2(i.sp - i.pp) : null]));
	XLSX.utils.book_append_sheet(wb, sheet(reg, { 1: FMT_D, 3: FMT_E, 5: FMT_D, 6: FMT_E, 7: FMT_E },
		[{ wch: 10, hidden: true }, { wch: 17 }, { wch: 40 }, { wch: 15 }, { wch: 13 }, { wch: 17 }, { wch: 15 }, { wch: 12 }]), 'Registro');

	const now = new Date();
	const mag = [['Data acquisto', 'Descrizione', 'Prezzo acquisto', 'Giorni in magazzino']];
	sorted.filter(i => i.sp == null).forEach(i => mag.push([ser(i.dt), i.ds, i.pp, Math.floor((now - i.dt) / 864e5)]));
	XLSX.utils.book_append_sheet(wb, sheet(mag, { 0: FMT_D, 2: FMT_E }, [{ wch: 17 }, { wch: 40 }, { wch: 15 }, { wch: 20 }]), 'Magazzino');

	const by = {};
	const slot = k => by[k] = by[k] || { b: 0, s: 0, n: 0, r: 0, c: 0 };
	items.forEach(i => { const a = slot(ym(i.dt)); a.b++; a.s += i.pp; if (i.sp != null) { const v = slot(ym(i.sdt)); v.n++; v.r += i.sp; v.c += i.pp; } });
	const rie = [['Mese', 'Oggetti acquistati', 'Speso', 'Oggetti venduti', 'Incassato', 'Costo del venduto', 'Utile', 'Margine %']];
	const tot = { b: 0, s: 0, n: 0, r: 0, c: 0 };
	Object.keys(by).sort().forEach(k => { const x = by[k]; for (const f in tot) tot[f] += x[f];
		rie.push([k, x.b, r2(x.s), x.n, r2(x.r), r2(x.c), r2(x.r - x.c), x.r ? r2((x.r - x.c) / x.r * 100) : 0]); });
	rie.push(['Totale', tot.b, r2(tot.s), tot.n, r2(tot.r), r2(tot.c), r2(tot.r - tot.c), tot.r ? r2((tot.r - tot.c) / tot.r * 100) : 0]);
	XLSX.utils.book_append_sheet(wb, sheet(rie, { 2: FMT_E, 4: FMT_E, 5: FMT_E, 6: FMT_E, 7: '0.0' },
		[{ wch: 10 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 18 }, { wch: 14 }, { wch: 11 }]), 'Riepilogo mensile');
	return wb;
}

$('btnDl').onclick = () => {
	try {
		const d = new Date();
		const stamp = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes());
		XLSX.writeFile(buildWb(), 'gestionale_' + stamp + '.xlsx');
	} catch (e) { alert('Download non riuscito: ' + e.message); }
};

// --- UI ------------------------------------------------------------------

function months() {
	const s = new Set(); items.forEach(i => { s.add(ym(i.dt)); if (i.sdt) s.add(ym(i.sdt)); });
	const cur = $('per').value || 'all';
	$('per').innerHTML = '<option value="all">Sempre</option>' + [...s].sort().reverse().map(m => {
		const [y, mm] = m.split('-'); const l = new Date(+y, mm - 1).toLocaleString('it-IT', { month: 'long', year: 'numeric' });
		return '<option value="' + m + '">' + l.charAt(0).toUpperCase() + l.slice(1) + '</option>'; }).join('');
	$('per').value = [...$('per').options].some(o => o.value === cur) ? cur : 'all';
}

function metric(label, value, color) {
	return '<div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-500">' + label + '</p><p class="text-xl font-semibold mt-1 ' + (color || 'text-slate-800') + '">' + value + '</p></div>';
}

function render() {
	const p = $('per').value, f = $('flt').value, q = $('q').value.trim().toLowerCase();
	const inP = d => p === 'all' ? true : (d ? ym(d) === p : false);
	const bought = items.filter(i => inP(i.dt));
	const sold = items.filter(i => i.sp != null ? inP(i.sdt) : false);
	const stock = items.filter(i => i.sp == null);
	const spent = bought.reduce((a, i) => a + i.pp, 0), rev = sold.reduce((a, i) => a + i.sp, 0), cost = sold.reduce((a, i) => a + i.pp, 0);
	const prof = rev - cost, mg = rev ? prof / rev * 100 : 0, sv = stock.reduce((a, i) => a + i.pp, 0);
	$('mets').innerHTML =
		metric('Speso in acquisti', eur(spent)) + metric('Incassato', eur(rev)) +
		metric('Utile netto', eur(prof), prof > 0 ? 'text-emerald-600' : prof < 0 ? 'text-red-600' : '') +
		metric('Margine sulle vendite', mg.toFixed(1).replace('.', ',') + '%') + metric('Oggetti venduti', sold.length) +
		metric('In magazzino', stock.length + ' <span class="text-sm font-normal text-slate-500">· ' + eur(sv) + '</span>');

	const rows = items.filter(i => inP(i.dt) || inP(i.sdt))
		.filter(i => f === 'all' ? true : (f === 'sold' ? i.sp != null : i.sp == null))
		.filter(i => !q || i.ds.toLowerCase().includes(q))
		.sort((a, b) => b.dt - a.dt);

	if (!rows.length) { $('rows').innerHTML = '<tr><td colspan="6" class="px-4 py-10 text-center text-slate-400">Nessun oggetto da mostrare. Registra il primo acquisto qui sopra.</td></tr>'; return; }

	const inp = 'rounded-md border border-slate-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500';
	const ico = 'text-slate-400 hover:text-slate-700 px-2 py-1 rounded-md hover:bg-slate-100';
	$('rows').innerHTML = rows.map(i => {
		const isS = i.sp != null, u = isS ? r2(i.sp - i.pp) : null;
		let v;
		if (selling === i.id) {
			v = '<div class="flex flex-wrap items-center gap-2">' +
				'<input id="sellDt" type="datetime-local" value="' + toInput(new Date()) + '" class="' + inp + '">' +
				'<input id="sellPr" type="number" min="0" step="0.01" placeholder="Prezzo €" class="' + inp + ' w-28" onkeydown="if(event.key===\'Enter\')doSell(\'' + i.id + '\')">' +
				'<button onclick="doSell(\'' + i.id + '\')" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-md px-3 py-1 text-sm">Conferma</button>' +
				'<button onclick="selling=null;render()" class="text-slate-500 hover:text-slate-800 text-sm px-2">Annulla</button>' +
				'<span id="sellErr" class="text-xs text-red-600 w-full"></span></div>';
		} else if (isS) {
			v = '<span class="inline-block rounded-md bg-emerald-50 text-emerald-700 px-2 py-0.5 font-medium">' + eur(i.sp) + '</span><span class="text-xs text-slate-400 ml-2">' + fmt(i.sdt) + '</span>';
		} else {
			v = '<button onclick="startSell(\'' + i.id + '\')" class="border border-slate-300 hover:bg-slate-50 rounded-md px-3 py-1 text-sm">Vendi</button>';
		}
		return '<tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">' +
			'<td class="px-4 py-3 text-slate-500 whitespace-nowrap">' + fmt(i.dt) + '</td>' +
			'<td class="px-4 py-3">' + esc(i.ds) + '</td>' +
			'<td class="px-4 py-3 text-right whitespace-nowrap">' + eur(i.pp) + '</td>' +
			'<td class="px-4 py-3">' + v + '</td>' +
			'<td class="px-4 py-3 text-right whitespace-nowrap ' + (u == null ? 'text-slate-300' : u >= 0 ? 'text-emerald-600' : 'text-red-600') + '">' + (u == null ? '—' : eur(u)) + '</td>' +
			'<td class="px-4 py-3 text-right whitespace-nowrap">' +
				(isS ? '<button title="Annulla vendita" onclick="unsell(\'' + i.id + '\')" class="' + ico + '">↩</button>' : '') +
				'<button title="Elimina" onclick="del(\'' + i.id + '\')" class="' + ico + '">✕</button>' +
			'</td></tr>';
	}).join('');
}

function refreshUI() { months(); render(); }

$('add').onclick = async () => {
	const dt = $('dt').value, ds = $('ds').value.trim(), pp = parseFloat($('pr').value);
	if (!dt) return $('err').textContent = 'Inserisci data e ora';
	if (!ds) return $('err').textContent = 'Inserisci una descrizione';
	if (isNaN(pp) || pp < 0) return $('err').textContent = 'Inserisci un prezzo valido';
	$('add').disabled = true;
	try {
		putLocal(await api('items/', 'POST', toApi({ dt: fromInput(dt), ds, pp, sp: null, sdt: null })));
		$('ds').value = ''; $('pr').value = ''; $('dt').value = toInput(new Date()); $('ds').focus();
		refreshUI();
	} catch (e) { $('err').textContent = 'Non salvato: ' + e.message; }
	finally { $('add').disabled = false; }
};
['dt', 'ds', 'pr'].forEach(id => {
	$(id).addEventListener('input', () => $('err').textContent = '');
	$(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });
});

window.startSell = id => { selling = id; render(); setTimeout(() => { const el = $('sellPr'); if (el) el.focus(); }); };
window.doSell = async id => {
	const sp = parseFloat($('sellPr').value), sdt = $('sellDt').value;
	if (isNaN(sp) || sp < 0) return $('sellErr').textContent = 'Inserisci un prezzo valido';
	if (!sdt) return $('sellErr').textContent = 'Inserisci la data di vendita';
	try {
		putLocal(await api('items/' + id + '/vendi/', 'POST', { vendita_dt: fromInput(sdt).toISOString(), prezzo_vendita: money(sp) }));
		selling = null; refreshUI();
	} catch (e) { const el = $('sellErr'); if (el) el.textContent = 'Non salvato: ' + e.message; }
};
window.unsell = async id => {
	if (!confirm('Annullare la vendita? L\'oggetto torna in magazzino.')) return;
	try { putLocal(await api('items/' + id + '/annulla_vendita/', 'POST')); refreshUI(); }
	catch (e) { alert('Non salvato: ' + e.message); }
};
window.del = async id => {
	if (!confirm('Eliminare definitivamente questo oggetto?')) return;
	try { await api('items/' + id + '/', 'DELETE'); items = items.filter(x => x.id !== id); refreshUI(); }
	catch (e) { alert('Non eliminato: ' + e.message); }
};

['per', 'flt'].forEach(id => $(id).addEventListener('change', render));
$('q').addEventListener('input', render);
window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

load();
</script>
